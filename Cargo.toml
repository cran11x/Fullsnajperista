[package]
name = "Fullsnajperista"
version = "0.3.0"
edition = "2021"

[dependencies]
# Solana Core
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"

# SPL Token
spl-token = "4.0"
spl-associated-token-account = "2.3"

# Async Runtime
tokio = { version = "1.35", features = ["full", "sync"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# HTTP Client - CRITICAL!
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Encoding
bs58 = "0.5"
base64 = "0.21"

# Error Handling
anyhow = "1.0"

# Utility
dotenv = "0.15"
rand = "0.8"
chrono = "0.4"
borsh = "1.5.7"
lru = "0.12"
once_cell = "1.19"

# GUI Framework - using latest version to fix macOS NSScreen issues
eframe = "0.29"
egui = "0.29"
open = "5.2"

[dev-dependencies]
# Testing
mockito = "1.2"
tokio-test = "0.4"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Isključujem upozorenja o neiskorišćenim stvarima
# Koristićemo #![allow(...)] direktno u fajlovima jer [lints.rust] zahteva Rust 1.80+