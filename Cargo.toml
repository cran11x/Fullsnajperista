[package]
name = "Fullsnajperista"
version = "0.3.0"
edition = "2021"

[dependencies]
# Solana Core
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"

# SPL Token
spl-token = "4.0"
spl-associated-token-account = "2.3"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# HTTP Client - CRITICAL!
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Encoding
bs58 = "0.5"
base64 = "0.21"

# Error Handling
anyhow = "1.0"

# Utility
dotenv = "0.15"
rand = "0.8"
chrono = "0.4"
borsh = "1.5.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true