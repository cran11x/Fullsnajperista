# Netlify configuration

# Fullsnajperista website
static_sites:
  - name: fullsnajperista
    buildCommand: echo "No build needed - static site"
    publishPath: website
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Other projects
  - name: closelook-mail
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
