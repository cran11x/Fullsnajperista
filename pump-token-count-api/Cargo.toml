[package]
name = "pump-token-count-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Redis client with connection pooling
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
bs58 = "0.5"

# Solana SDK for Pubkey parsing
solana-sdk = "1.18"

# WebSocket client
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Error handling
anyhow = "1.0"

# Environment variables
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[[bin]]
name = "bulk_load"
path = "src/bin/bulk_load.rs"

[[bin]]
name = "extract_creators_from_tx_csv"
path = "src/bin/extract_creators_from_tx_csv.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

